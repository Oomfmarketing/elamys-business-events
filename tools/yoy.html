  return crypto.subtle.deriveKey({ name:"PBKDF2", salt, iterations:ITER, hash:"SHA-256" }, k, { name:"AES-GCM", length:256 }, false, ["decrypt"]);
}
(async () => {
  const pw = sessionStorage.getItem("be_tools_pw");
  if (!pw) { location.href = "/?return=" + encodeURIComponent(location.pathname); return; }
  try {
    const key = await dk(pw, b(S));
    const plain = await crypto.subtle.decrypt({ name:"AES-GCM", iv:b(N) }, key, b(C));
    document.open(); document.write(new TextDecoder().decode(plain)); document.close();
  } catch (e) {
    sessionStorage.removeItem("be_tools_pw");
    location.href = "/?error=1&return=" + encodeURIComponent(location.pathname);
  }
})();
